name: XenDroid
on:
  pull_request:
    branches: main
    
  push:
    branches: main 

permissions:
  contents: write
  actions:  write

jobs:
  build-arm64_v8a:
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/cirruslabs/android-sdk:35

    # Allow to use gradle wrapper from xenia
    env:
      ANDROID_PLATFORM: android-35
      ANDROID_NDK_VERSION: 29.0.14206865

      # Gradle tuning
      GRADLE_OPTS: -Dorg.gradle.daemon=false

      # Native compile cache
      USE_CCACHE: 'true'
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content

    steps:

    # Whether this repository can sign a release at all.
    #
    # A fork, and any clone without the maintainer's keystore, has no
    # ANDROID_KEYSTORE_BASE64. Hard-failing on it meant the job died at step 1
    # and NOTHING after it ran -- including the JVM unit tests, which are the
    # only check that has never been executed on a fork and the one thing worth
    # getting green. So this records the capability instead of demanding it, and
    # the signing/artifact steps below are gated on it. Tests and lint stay
    # unconditional: they need no secrets and are the reason to run this at all.
    #
    # The upstream behaviour is unchanged when the secret IS present: same
    # failure text on a real misconfiguration, because HAS_KEYSTORE is true and
    # the gated steps still hard-fail.
    - name: Detect signing capability
      run: |
        if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
          echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
          echo "Signing secrets present - release build and signature will run."
        else
          echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
          echo "::notice::No ANDROID_KEYSTORE_BASE64 in this repository (expected on a fork). Skipping the release build and signing; unit tests and lint still run below. To enable releases, add the repository secrets ANDROID_KEYSTORE_BASE64, KEY_ALIAS, KEYSTORE_PASSWORD, KEY_PASSWORD."
        fi

    ##################################################################
    # Checkout
    ##################################################################
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Configure Git
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    ##################################################################
    # System tools
    ##################################################################
    - name: Install tools
      run: |
        apt-get update
        apt-get install -y ninja-build python3 glslang-tools spirv-tools


    ##################################################################
    # Cache Gradle
    ##################################################################
    - name: Cache Gradle
      uses:  gradle/actions/setup-gradle@v4
      with:
        gradle-home-cache-strict-match: false
        validate-wrappers: false


    ##################################################################
    # Android SDK / NDK
    ##################################################################
    - name: Cache NDK + CMake
      uses: actions/cache@v4
      with:
        path: |
          /opt/android-sdk-linux/ndk/${{ env.ANDROID_NDK_VERSION }}
          /opt/android-sdk-linux/cmake/3.30.3
        key: sdk-ndk${{ env.ANDROID_NDK_VERSION }}-cmake3.30.3

    - name: Install Android NDK
      run: |
        export ANDROID_SDK_ROOT=/opt/android-sdk-linux

        yes | sdkmanager --licenses

        if [ ! -d "$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" ]; then
          sdkmanager "ndk;$ANDROID_NDK_VERSION"
        fi

        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> $GITHUB_ENV

    ##################################################################  
    # CMake Install
    ##################################################################
    - name: Install CMake
      run: |
        export ANDROID_SDK_ROOT=/opt/android-sdk-linux

        if [ ! -d "$ANDROID_SDK_ROOT/cmake/3.30.3" ]; then
            sdkmanager "cmake;3.30.3"
        fi

        echo "CMAKE_HOME=$ANDROID_SDK_ROOT/cmake/3.30.3" >> $GITHUB_ENV

    ##################################################################
    # local.properties
    ##################################################################
    - name: Generate local.properties
      run: |
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    ##################################################################
    # Restore keystore
    ##################################################################
    - name: Decode keystore
      if: env.HAS_KEYSTORE == 'true'
      run: |
        if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
          echo "::error::ANDROID_KEYSTORE_BASE64 secret is not configured."
          exit 1
        fi

        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

        if [ ! -s release.keystore ]; then
          echo "::error::Failed to decode keystore or keystore is empty."
          exit 1
        fi

    - name: Check signing secrets
      if: env.HAS_KEYSTORE == 'true'
      run: |
        if [ ! -n "${{ secrets.KEY_ALIAS }}" ]; then
          echo "::error::Failed to fetch key alias."
          exit 1
        fi

        if [ ! -n "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
          echo "::error::Failed to fetch keystore password."
          exit 1
        fi

        if [ ! -n "${{ secrets.KEY_PASSWORD }}" ]; then
          echo "::error::Failed to fetch key password."
          exit 1
        fi

    ##################################################################
    # Gradle properties
    #################################################################
    - name: Generate gradle.properties
      run: |
        cat > gradle.properties <<EOF
        org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
        org.gradle.parallel=true
        org.gradle.caching=true
        org.gradle.configuration-cache=true

        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

    ##################################################################
    # Native compile cache (ccache)
    ##################################################################
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-ndk${{ env.ANDROID_NDK_VERSION }}-arm64
        max-size: 2G

    - name: Get Git hash
      id: git
      run: echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    ##################################################################
    # JVM unit tests
    ##################################################################
    # Deliberately BEFORE the release APK build, and the ordering is the
    # whole point. Two very different failures have to stay tellable apart:
    #
    #   * a unit test fails      -> the Kotlin frontend changed wrong
    #   * the build fails        -> nearly always unrelated toolchain drift
    #                                (NDK/CMake install, ccache, network)
    #
    # If the build ran first and broke, the job would stop before a single test
    # executed and the report would say "build failed" -- the test result would
    # be UNKNOWN, not green, and the second failure would be invisible. Running
    # the (fast, JVM-only) tests first means a test failure is reported as a
    # test failure and a toolchain failure is still reported as a toolchain
    # failure, but neither can hide the other. It also means a genuinely red
    # test aborts the run in a couple of minutes instead of after a full native
    # build.
    #
    # `:app:testDebugUnitTest`, not `testReleaseUnitTest`:
    #   - release has minifyEnabled + shrinkResources (app/build.gradle:86-91).
    #     R8 only rewrites the APK -- AGP does NOT run unit tests against the
    #     minified output unless testProguardFiles is configured, so a release
    #     test run would exercise the same 14 classes with none of the risk R8
    #     adds, while paying to build the release variant.
    #   - debug is the variant Android Studio's "Run Unit Tests" targets, so
    #     this is exactly what a developer runs before pushing.
    #
    # -PgitHash mirrors the assembleRelease invocation below. It does not
    # change any assertion (it only feeds BuildConfig.VERSION_NAME), but it
    # keeps both Gradle invocations' inputs identical so the build cache and
    # the configured project model are shared instead of built twice.
    #
    # The keystore gate is no longer upstream of these tests. "Detect signing
    # capability" records HAS_KEYSTORE instead of exiting, so a fork with no
    # secrets now reaches this step and actually runs them; only the signing and
    # release steps below are skipped. That was the whole reason for the change.
    - name: JVM unit tests
      run: |
        chmod +x gradlew

        ./gradlew :app:testDebugUnitTest \
          -PgitHash=${{ steps.git.outputs.hash }} \
          --build-cache \
          --parallel \
          --max-workers=$(nproc) \
          --no-daemon

    ##################################################################
    # Android lint (advisory)
    ##################################################################
    # continue-on-error on purpose. Lint has never run in this pipeline and
    # there is no lint baseline checked in, so the first run is expected to
    # report pre-existing issues that have nothing to do with the change under
    # test. A blocking lint gate added on the same day it is introduced is a
    # guaranteed-red gate, and a red gate nobody is watching is worse than no
    # gate: it teaches everyone to ignore red. Reported, never blocking, until
    # there is a baseline to diff against.
    #
    # Placed next to the unit tests because both run against the :app debug
    # variant, so this reuses the classes those tests just compiled rather than
    # recompiling them.
    - name: Android lint (advisory)
      continue-on-error: true
      run: |
        ./gradlew :app:lintDebug \
          -PgitHash=${{ steps.git.outputs.hash }} \
          --build-cache \
          --parallel \
          --max-workers=$(nproc) \
          --no-daemon

    ##################################################################
    # Build
    ##################################################################
    - name: Build Release APK
      if: env.HAS_KEYSTORE == 'true'
      run: |
        chmod +x gradlew

        ./gradlew assembleRelease \
          -PgitHash=${{ steps.git.outputs.hash }} \
          --build-cache \
          --parallel \
          --max-workers=$(nproc) \
          --no-daemon

    ##################################################################
    # Sign APK
    ##################################################################
    - name: Sign APK
      if: env.HAS_KEYSTORE == 'true'
      run: |
        APK=$(find . -name "*release*.apk" | head -n 1)

        "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" sign \
          --ks release.keystore \
          --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
          --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
          --key-pass pass:${{ secrets.KEY_PASSWORD }} \
          "$APK"

    - name: Verify Signature
      if: env.HAS_KEYSTORE == 'true'
      run: |
        APK=$(ls app/build/outputs/apk/release/*.apk)

        "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify "$APK"

    ##################################################################
    # Artifact naming
    ##################################################################
    - name: Compute SHA
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Rename APK
      if: env.HAS_KEYSTORE == 'true'
      run: |
        APK=$(ls app/build/outputs/apk/release/*.apk)
        mv "$APK" "XenDroid_Release_${{ steps.vars.outputs.sha_short }}.apk"

    ##################################################################
    # Delete old artifacts if needed
    ##################################################################
    - name: Delete oldest artifacts
      if: env.HAS_KEYSTORE == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;

          const artifacts = await github.paginate(
            github.rest.actions.listArtifactsForRepo,
            {
              owner,
              repo,
              per_page: 100
            }
          );

          // Ordina dal più vecchio al più recente
          artifacts.sort(
            (a, b) => new Date(a.created_at) - new Date(b.created_at)
          );
          
          if (artifacts.length >= 2) {
            for (const artifact of artifacts.slice(0, 2)) {
              core.info(`Deleting artifact: ${artifact.name}`);

              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id
              });
            }
          } else {
            core.info("Less than 2 artifacts found, nothing to delete.");
          }

    - name: Upload artifact
      # Gated on HAS_KEYSTORE as well as the event: the renamed APK only exists
      # when the release build ran, so without the gate this step would fail on
      # a missing path instead of skipping cleanly.
      if: env.HAS_KEYSTORE == 'true' && (github.event_name != 'push' || github.ref != 'refs/heads/main')
      uses: actions/upload-artifact@v4
      with:
        name: XenDroid_Release_${{ steps.vars.outputs.sha_short }}
        path: XenDroid_Release_${{ steps.vars.outputs.sha_short }}.apk

    - name: Create GitHub Release
      # Same gate. Without it a fork with no keystore would still reach this
      # step on a push to main and try to publish a release built from nothing.
      if: env.HAS_KEYSTORE == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: XenDroid-${{ steps.vars.outputs.sha_short }}
        name: XenDroid ${{ steps.vars.outputs.sha_short }}
        generate_release_notes: true
        files: XenDroid_Release_${{ steps.vars.outputs.sha_short }}.apk
